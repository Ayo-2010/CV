<!-- Contact Section -->
<section id="contact" class="section contact-section">
  <div class="container">
    <div class="contact-wrapper">
      <div class="contact-text">
        <h2 class="section-title">Let's Work Together</h2>
        <p>I'm always interested in hearing about new projects and opportunities. Whether you have a question or just want to say hello, feel free to reach out.</p>
        <div class="contact-options">
          <a href="mailto:ayoabdullah13@gmail.com" class="contact-option">
            <span class="contact-icon">✉</span>
            <div>
              <p class="contact-label">Email</p>
              <p>ayoabdullah13@gmail.com</p>
            </div>
          </a>
          <a href="#" class="contact-option">
            <span class="contact-icon">💬</span>
            <div>
              <p class="contact-label">LinkedIn</p>
              <p>Connect with me</p>
            </div>
          </a>
        </div>
      </div>
      <form class="contact-form" action="mailto:ayoabdullah13@gmail.com" method="post" enctype="text/plain">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Send Message</button>
      </form>
    </div>
  </div>
</section>
